<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micnaga</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="library.css">
<link rel="stylesheet" href="secretaria.css">
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<div class="app">
  <aside class="side glass" aria-label="Reuniones" data-i18n-aria-label="library.side_label">
    <header class="side-head">
      <h1 class="display" data-i18n="library.title">Biblioteca</h1>
      <span class="count display tnum" id="count"></span>
    </header>
    <div class="search">
      <span data-icon="search" aria-hidden="true"></span>
      <input id="q" class="search-input" type="search" autocomplete="off" spellcheck="false"
             data-i18n-placeholder="library.search_placeholder" data-i18n-aria-label="library.search_label">
      <kbd class="slash" aria-hidden="true">/</kbd>
      <button class="icon-btn clear" id="q-clear" type="button" hidden data-i18n-aria-label="library.search_clear" data-icon="x"></button>
    </div>
    <div class="side-scroll" id="side" tabindex="-1"></div>
    <section class="held" id="held" hidden>
      <button class="held-h" id="held-h" type="button" aria-expanded="false" aria-controls="held-list">
        <span class="caps" data-i18n="library.held.title">Descartadas</span>
        <span class="held-n tnum" id="held-n"></span>
        <span class="held-chev" data-icon="chevron" aria-hidden="true"></span>
      </button>
      <div class="held-list" id="held-list" hidden></div>
    </section>
  </aside>

  <main class="main glass" id="main">
    <div class="empty" id="empty">
      <div class="empty-art" aria-hidden="true"><span></span><span></span><span></span><i data-icon="library" data-icon-class="xl"></i></div>
      <h2 class="display" data-i18n="library.empty_title">Elige una reunión</h2>
    </div>

    <section class="viewer" id="viewer" hidden>
      <header class="mh">
        <div class="mh-top">
          <div class="mh-titles">
            <h2 class="display" id="m-title"></h2>
            <p class="m-meta tnum" id="m-meta"></p>
          </div>
          <button class="icon-btn" id="open-folder" type="button" data-icon="folder" data-i18n-aria-label="library.open_folder" data-i18n-data-tip="library.open_folder"></button>
        </div>
        <div class="speakers" id="speakers" role="list" data-i18n-aria-label="library.speakers_label"></div>
        <section class="markers" id="markers" hidden aria-labelledby="markers-h">
          <h3 class="sr-only" id="markers-h" data-i18n="library.markers">Marcadores</h3>
          <span class="markers-ico" aria-hidden="true" data-icon="flag"></span>
          <div class="marker-list" id="marker-list"></div>
        </section>
      </header>

      <div class="transcript selectable" id="tr" role="group" data-i18n-aria-label="library.transcript_label" tabindex="-1"><section class="sec" id="sec" hidden aria-live="polite"></section></div>

      <footer class="player" id="player">
        <button class="play" id="play" type="button" data-i18n-aria-label="library.play" data-i18n-title="library.play">
          <span class="swap"></span>
        </button>
        <span class="clock tnum" id="clock">00:00</span>
        <div class="scrub" id="scrub" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
             data-i18n-aria-label="library.seek">
          <div class="scrub-track"><i id="scrub-fill"></i></div>
          <div class="scrub-ticks" id="ticks"></div>
          <span class="scrub-thumb" id="thumb"></span>
        </div>
        <span class="clock dim tnum" id="total">00:00</span>
        <div class="seg" id="rate" role="group" data-i18n-aria-label="library.speed">
          <button type="button" data-rate="1" aria-pressed="true">1×</button>
          <button type="button" data-rate="1.5" aria-pressed="false">1,5×</button>
          <button type="button" data-rate="2" aria-pressed="false">2×</button>
        </div>
        <div class="tracks" id="tracks" role="group" data-i18n-aria-label="library.tracks"></div>
      </footer>
    </section>
  </main>
</div>

<div class="menu" id="menu" role="menu" hidden></div>
<div class="snack" id="snack" role="status" aria-live="polite"></div>

<dialog id="dlg-consent" aria-labelledby="dc-title">
  <form method="dialog" class="dlg">
    <div class="dlg-ico" data-icon="shield" data-icon-class="lg" aria-hidden="true"></div>
    <h3 id="dc-title" class="display" data-i18n="library.consent.title">Guardar la huella de voz</h3>
    <p id="dc-person" class="dlg-person"></p>
    <p class="dlg-text" data-i18n="library.consent.body">Es un dato biométrico (RGPD). Se guarda cifrado en este equipo y puedes borrarlo cuando quieras.</p>
    <label class="check"><input type="checkbox" id="dc-check"><span data-i18n="library.consent.checkbox">Tengo su consentimiento</span></label>
    <div class="dlg-actions">
      <button class="btn btn-ghost" value="cancel" data-i18n="common.cancel">Cancelar</button>
      <button class="btn btn-primary" value="ok" id="dc-ok" disabled data-i18n="library.consent.save">Guardar huella</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-merge" aria-labelledby="dm-title">
  <form method="dialog" class="dlg">
    <div class="dlg-ico" data-icon="merge" data-icon-class="lg" aria-hidden="true"></div>
    <h3 id="dm-title" class="display" data-i18n="library.merge.title">Fusionar hablantes</h3>
    <p class="dlg-text" id="dm-text"></p>
    <div class="dlg-actions">
      <button class="btn btn-ghost" value="cancel" data-i18n="common.cancel">Cancelar</button>
      <button class="btn btn-primary" value="ok" data-i18n="library.merge.confirm">Fusionar</button>
    </div>
  </form>
</dialog>

<script src="bridge.js"></script>
<script src="library.js"></script>
<script src="secretaria.js"></script>
</body>
</html>
