<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micnaga</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="wizard.css">
</head>
<body>
<div class="ambient" aria-hidden="true" data-rise="150" data-cx="0.5" data-gain="0.78" data-fall="90"></div>
<!-- One click: the installer opens this; models download and the audio checks itself, then it
     closes on its own. The only control appears if something fails (retry). -->
<main class="wiz" id="wiz" data-state="running" aria-labelledby="h1">
  <div class="mark" aria-hidden="true">
    <svg class="ring-progress" viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="56"/><circle class="fill" id="ring-fill" cx="60" cy="60" r="56" pathLength="100"/></svg>
    <span class="r r1"></span><span class="r r2"></span><span class="r r3"></span>
    <span class="core"><i class="rec-dot"></i><span class="done-ico" data-icon="check"></span></span>
  </div>

  <h1 class="display hero" id="h1" data-i18n="wizard.title">Micnaga</h1>
  <div class="overall" id="overall">
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="overall-bar" data-i18n-aria-label="wizard.progress"><i id="overall-fill"></i></div>
    <p class="status tnum" id="overall-text" data-i18n="wizard.preparing">Preparando</p>
  </div>

  <div class="checks" role="group" data-i18n-aria-label="wizard.audio_label">
    <span class="chk" id="c-mic" data-ok="false"><span data-icon="mic" aria-hidden="true"></span><canvas class="wave" data-dither="2" id="m-mic" role="meter" data-i18n-aria-label="wizard.mic" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></canvas><span class="tick" aria-hidden="true" data-icon="check"></span></span>
    <span class="chk" id="c-sys" data-ok="false"><span data-icon="speaker" aria-hidden="true"></span><canvas class="wave" data-dither="2" id="m-sys" role="meter" data-i18n-aria-label="wizard.sys" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></canvas><span class="tick" aria-hidden="true" data-icon="check"></span></span>
  </div>

  <div class="fail" id="fail" hidden>
    <p class="err" id="dl-error" role="alert"></p>
    <button class="btn btn-primary" id="retry" type="button" data-icon="refresh"><span data-i18n="wizard.retry">Reintentar</span></button>
  </div>

  <p class="by"><span data-i18n="wizard.by">Hecho por</span><span class="brand"><img class="on-dark" src="assets/bitnaga-on-dark.svg" alt="Bitnaga"><img class="on-light" src="assets/bitnaga-on-light.svg" alt="Bitnaga"></span></p>
</main>
<span class="sr-only" id="live" role="status" aria-live="polite"></span>
<script src="bridge.js"></script>
<script src="wizard.js"></script>
<script src="dither.js"></script>
</body>
</html>
